<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <rect width="1600" height="900" fill="#ffffff"/>
  <defs>
    <g id="xh">
      <path d="M0,-30 C12,-34 26,-24 28,-8 C30,6 24,22 12,28 C0,33 -14,31 -24,22 C-34,12 -34,-6 -26,-18 C-18,-30 -8,-32 0,-30Z" fill="#1a1a1a"/>
      <circle cx="-9" cy="-7" r="3" fill="#ffffff"/>
      <circle cx="9" cy="-7" r="3" fill="#ffffff"/>
      <path d="M-9,28 L-11,42 M9,28 L11,42" stroke="#1a1a1a" stroke-width="4" stroke-linecap="round"/>
    </g>
    <g id="xhm">
      <path d="M0,-30 C12,-34 26,-24 28,-8 C30,6 24,22 12,28 C0,33 -14,31 -24,22 C-34,12 -34,-6 -26,-18 C-18,-30 -8,-32 0,-30Z" fill="#1a1a1a"/>
      <circle cx="-9" cy="-7" r="3" fill="#ffffff"/>
      <circle cx="9" cy="-7" r="3" fill="#ffffff"/>
      <path d="M-8,28 L-24,40 M10,26 L26,36" stroke="#1a1a1a" stroke-width="4" stroke-linecap="round"/>
    </g>
    <marker id="arr" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#e8862d"/>
    </marker>
  </defs>
  <style>.n { font-family: "Comic Sans MS","Segoe Script","Brush Script MT",cursive; }</style>

  <text x="800" y="96" text-anchor="middle" class="n" font-size="50" fill="#1a1a1a" transform="rotate(-1 800 96)">never stare at the oven</text>
  <text x="800" y="144" text-anchor="middle" class="n" font-size="28" fill="#3d6ea8">while one warp waits, the scheduler runs another</text>

  <!-- ground -->
  <path d="M110,680 L1500,680" stroke="#1a1a1a" stroke-width="3" stroke-linecap="round"/>

  <!-- slow oven / memory on left -->
  <g transform="translate(260,580)">
    <path d="M-80,-80 L80,-80 L80,100 L-80,100 Z" fill="#ffffff" stroke="#1a1a1a" stroke-width="3"/>
    <path d="M-80,-80 C-74,-96 74,-96 80,-80" fill="none" stroke="#1a1a1a" stroke-width="3"/>
    <rect x="-52" y="-100" width="24" height="16" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/>
    <rect x="28" y="-100" width="24" height="16" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/>
    <path d="M-30,-50 L-14,-50 M-6,-50 L10,-50 M18,-50 L34,-50" stroke="#1a1a1a" stroke-width="2" stroke-linecap="round"/>
    <path d="M-30,-20 L-14,-20 M-6,-20 L10,-20 M18,-20 L34,-20" stroke="#1a1a1a" stroke-width="2" stroke-linecap="round"/>
  </g>
  <text x="260" y="420" text-anchor="middle" class="n" font-size="26" fill="#d64545" transform="rotate(-2 260 420)">global memory</text>
  <text x="260" y="454" text-anchor="middle" class="n" font-size="22" fill="#d64545">slow. ~500 cycles</text>

  <!-- warp A: stalled, xiaohei waiting beside the oven -->
  <g transform="translate(460,638) scale(1.1)">
    <use href="#xh"/>
    <path d="M-22,-2 C-42,-12 -52,-14 -64,-8" fill="none" stroke="#1a1a1a" stroke-width="4" stroke-linecap="round"/>
  </g>
  <text x="480" y="530" text-anchor="middle" class="n" font-size="24" fill="#d64545">warp A — stalled</text>
  <text x="480" y="560" text-anchor="middle" class="n" font-size="22" fill="#d64545">waiting on memory</text>

  <!-- swap arrow -->
  <path d="M620,540 C760,480 900,460 1010,500" stroke="#e8862d" stroke-width="5" fill="none" stroke-linecap="round" stroke-dasharray="14 10" marker-end="url(#arr)"/>
  <text x="800" y="440" text-anchor="middle" class="n" font-size="30" fill="#e8862d" transform="rotate(-3 800 440)">scheduler swaps in</text>

  <!-- warp B: actively running on right -->
  <g transform="translate(1100,636) scale(1.2)">
    <use href="#xhm"/>
    <path d="M22,-10 L46,-22" stroke="#1a1a1a" stroke-width="4" stroke-linecap="round"/>
    <path d="M46,-22 L52,-36 L58,-22 Z" fill="#1a1a1a"/>
  </g>
  <g transform="translate(1250,636) scale(1.2)">
    <use href="#xhm"/>
    <path d="M22,-10 L46,-22" stroke="#1a1a1a" stroke-width="4" stroke-linecap="round"/>
    <path d="M46,-22 L52,-36 L58,-22 Z" fill="#1a1a1a"/>
  </g>
  <text x="1175" y="490" text-anchor="middle" class="n" font-size="28" fill="#3d6ea8">warp B — ready</text>
  <text x="1175" y="524" text-anchor="middle" class="n" font-size="26" fill="#3d6ea8">runs while A waits</text>

  <!-- bottom note -->
  <text x="800" y="800" text-anchor="middle" class="n" font-size="30" fill="#1a1a1a" transform="rotate(-1 800 800)">latency hiding: keep the chip busy, always</text>
</svg>
