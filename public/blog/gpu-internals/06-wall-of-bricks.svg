      <path d="M-40,-10 L-24,-10 M-14,-10 L2,-10 M12,-10 L28,-10 M38,-10 L54,-10" stroke="#1a1a1a" stroke-width="2"/>
    </g>
  </defs>

  <style>
    .n { font-family: "Comic Sans MS","Segoe Script","Brush Script MT",cursive; }
  </style>

  <path d="M120,680 L1500,680" stroke="#1a1a1a" stroke-width="4" stroke-linecap="round"/>

  <g transform="translate(1280,640)">
