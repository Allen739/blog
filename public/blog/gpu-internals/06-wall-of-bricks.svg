    <use href="#brick" transform="translate(110,0)"/>
    <use href="#brick" transform="translate(55,-46)"/>
    <use href="#brick" transform="translate(165,-46)"/>
    <use href="#brick" transform="translate(110,-92)"/>
    <use href="#brick" transform="translate(220,-92)"/>
  </g>

  <use href="#xh" transform="translate(1030,600) scale(1.3)"/>
  <path d="M26,4 L70,8" stroke="#1a1a1a" stroke-width="5" stroke-linecap="round"/>
  <g transform="translate(1080,556) rotate(6)">
